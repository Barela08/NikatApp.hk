<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Har Dukaan, Har Service – Ek Jagah. Find nearby shops and services instantly." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NIKAT" />
    <meta name="application-name" content="NIKAT" />
    <meta name="msapplication-TileColor" content="#000000" />
    <meta name="msapplication-TileImage" content="/nikatlogo.png" />
    <meta property="og:title" content="NIKAT – Nearest Services" />
    <meta property="og:description" content="Har Dukaan, Har Service – Ek Jagah" />
    <meta property="og:image" content="/nikatlogo.png" />
    <meta property="og:type" content="website" />
    <link rel="apple-touch-icon" href="/nikatlogo.png" />
    <link rel="apple-touch-startup-image" href="/nikatlogo.png" />
    <link rel="icon" type="image/png" href="/nikatlogo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>NIKAT – Nearest Services</title>
    <style>
      html, body { margin: 0; padding: 0; background: #000; }
      #app-loading {
        position: fixed; inset: 0; background: #000;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        z-index: 9999; transition: opacity 0.4s ease;
      }
      #app-loading img { width: 100px; height: 100px; object-fit: contain; animation: pulse 1.5s ease-in-out infinite; }
      @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.7;transform:scale(0.95)} }
    </style>
  </head>
  <body>
    <div id="app-loading">
      <img src="/nikatlogo.png" alt="NIKAT" />
    </div>
    <div id="root"></div>
    <script>
      window.addEventListener('load', () => {
        setTimeout(() => {
          const loader = document.getElementById('app-loading');
          if (loader) { loader.style.opacity = '0'; setTimeout(() => loader.remove(), 400); }
        }, 600);
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
