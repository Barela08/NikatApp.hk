<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <!-- PWA Meta Tags -->
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Har Dukaan, Har Service – Ek Jagah. Find nearby shops and services instantly.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NIKAT">
  <meta name="application-name" content="NIKAT">
  <meta name="msapplication-TileColor" content="#000000">

  <!-- Open Graph -->
  <meta property="og:title" content="NIKAT – Nearest Services">
  <meta property="og:description" content="Har Dukaan, Har Service – Ek Jagah">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://nikat.app">

  <!-- Icons -->
  <link rel="icon" type="image/png" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">

  <!-- Splash screens for iOS -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <title>NIKAT – Nearest Services</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: #000000;
      height: 100%;
      overflow: hidden;
    }

    /* Loading splash */
    .loading-splash {
      position: fixed;
      inset: 0;
      background: #000000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s ease;
    }

    .loading-splash .logo-text {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 52px;
      font-weight: 900;
      color: #00FF88;
      letter-spacing: 8px;
      animation: glow 2s ease-in-out infinite;
    }

    .loading-splash .tagline {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 13px;
      color: #555555;
      margin-top: 8px;
      letter-spacing: 0.5px;
    }

    .loading-splash .spinner {
      width: 32px;
      height: 32px;
      border: 2px solid #1a1a1a;
      border-top: 2px solid #00FF88;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-top: 48px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes glow {
      0%, 100% { text-shadow: 0 0 20px rgba(0,255,136,0.3); }
      50% { text-shadow: 0 0 40px rgba(0,255,136,0.7), 0 0 60px rgba(0,255,136,0.4); }
    }
  </style>
</head>
<body>
  <!-- Splash shown while Flutter loads -->
  <div id="loading-splash" class="loading-splash">
    <div class="logo-text">NIKAT</div>
    <div class="tagline">Har Dukaan, Har Service – Ek Jagah</div>
    <div class="spinner"></div>
  </div>

  <script>
    // Hide splash when Flutter is ready
    window.addEventListener('flutter-first-frame', function() {
      const splash = document.getElementById('loading-splash');
      if (splash) {
        splash.style.opacity = '0';
        setTimeout(() => splash.remove(), 500);
      }
    });

    // Service Worker registration
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('flutter_service_worker.js?v=' + Date.now(), {
          scope: '/'
        });
      });
    }
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
